spring.application.name=farmlink-backend
server.port=8080

# Optional .env file in the backend folder (see .env.example). Real environment variables also work.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/farmlink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Password reset ---
# Base URL of the React app; used to build the link in the reset email.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@farmlink.local}
app.reset-token.ttl-minutes=${RESET_TOKEN_TTL_MINUTES:15}
app.reset-token.cooldown-seconds=${RESET_REQUEST_COOLDOWN_SECONDS:60}

# --- SMTP (optional) ---
# Email is sent only when spring.mail.host is provided, e.g. via the SPRING_MAIL_HOST,
# SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD environment variables (see README).
# Without it, the reset link is printed in the backend console (development mode).
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Session cookie hardening ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when serving over HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
