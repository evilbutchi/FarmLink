spring.application.name=farmlink-backend
server.port=8080

# Optional .env file in the backend folder (see .env.example). Real environment variables also work.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/farmlink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Session cookie hardening ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when serving over HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# --- Bootstrap admin (created once on startup if missing; password is BCrypt-hashed) ---
app.admin.email=${ADMIN_EMAIL:admin@farmlink.local}
app.admin.full-name=${ADMIN_NAME:FarmLink Administrator}
app.admin.password=${ADMIN_PASSWORD:}
